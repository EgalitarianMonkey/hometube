name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: Lint with black and ruff
        run: |
          python -m black --check app/ tests/
          python -m ruff check app/ tests/ --output-format=github

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -m "not slow and not external and not network" --cov=app.utils --cov=app.translations --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # The image is only ever built by release.yml (on a v* tag) and by the daily
  # refresh-ytdlp.yml, and that refresh skips the build whenever the yt-dlp
  # version is unchanged. A broken Dockerfile could therefore sit on main for
  # weeks and only surface at release time — which is exactly what happened when
  # the unpinned base image dropped its preinstalled pip. Build and smoke-test
  # it on every PR instead. Single-arch here for speed; release.yml still does
  # the full amd64+arm64 build.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hometube:ci
          platforms: linux/amd64
          cache-from: type=gha
          # ignore-error keeps a cache-export race from failing the build: when a
          # PR run and the main run export at the same time, one of them loses the
          # reservation and buildx would otherwise abort an image that built fine.
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Smoke-test the image
        run: |
          docker run -d --name hometube-ci hometube:ci
          for i in $(seq 1 24); do
            status=$(docker inspect hometube-ci --format '{{.State.Health.Status}}')
            [ "$status" = "healthy" ] && break
            [ "$(docker inspect hometube-ci --format '{{.State.Status}}')" != "running" ] && break
            sleep 5
          done
          docker logs hometube-ci
          test "$(docker inspect hometube-ci --format '{{.State.Health.Status}}')" = "healthy"
