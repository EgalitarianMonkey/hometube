# Labels drive the release-notes categories in .github/release.yml, so the
# change-type labels (feature, fix, perf, breaking) come from the branch name
# rather than from changed files — a bugfix touching app/ is not a "feature".

feature:
  - head-branch: ["^feat/", "^feature/"]

fix:
  - head-branch: ["^fix/", "^bugfix/", "^hotfix/"]

perf:
  - head-branch: ["^perf/"]

breaking:
  - head-branch: ["^breaking/"]

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "docs/**"

test:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

chore:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".devcontainer/**"

deps:
  - changed-files:
      - any-glob-to-any-file:
          - "pyproject.toml"
          - "uv.lock"
          - "requirements/**"

docker:
  - changed-files:
      - any-glob-to-any-file:
          - "Dockerfile"
          - "docker-compose*.yml"
          - ".dockerignore"

config:
  - changed-files:
      - any-glob-to-any-file:
          - "*.env*"
          - "*.ini"
          - "*.toml"
          - "*.yaml"
          - "*.yml"

ui:
  - changed-files:
      - any-glob-to-any-file:
          - "app/translations/**"
          - "app/main.py"

scripts:
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/**"
          - "*.sh"
