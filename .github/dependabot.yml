version: 2
updates:
  # Python dependencies managed by uv (pyproject.toml + uv.lock).
  # The requirements/*.txt files are compiled artifacts of uv and are
  # deliberately not tracked by a separate pip ecosystem entry.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    ignore:
      # Transitive deps of streamlit, which pins "pandas<3" and "numpy<3".
      # Dependabot proposes their major bumps anyway and CI stays green
      # (nothing imports them directly), but the resulting environment
      # violates streamlit's own constraints. Revisit when the streamlit
      # pin in pyproject.toml moves past a release that allows 3.x.
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    groups:
      github-actions:
        patterns:
          - "*"

  # Base image in Dockerfile (pinned to "latest" today, so PRs will be rare)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
