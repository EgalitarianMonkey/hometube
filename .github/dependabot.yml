version: 2
updates:
  # Python dependencies managed by uv (pyproject.toml + uv.lock).
  # The requirements/*.txt files are compiled artifacts of uv and are
  # deliberately not tracked by a separate pip ecosystem entry.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    ignore:
      # numpy is a transitive dep of streamlit, which still pins "numpy<3".
      # Dependabot proposes the major bump anyway and CI stays green (nothing
      # imports numpy directly), but the resulting environment violates
      # streamlit's own constraint. Drop this once streamlit allows 3.x.
      #
      # pandas used to be listed here for the same reason. streamlit 1.62
      # widened its pin to "pandas<4", so major pandas updates are allowed
      # again and are no longer ignored.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    groups:
      github-actions:
        patterns:
          - "*"

  # Base image in Dockerfile (pinned to "latest" today, so PRs will be rare)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
